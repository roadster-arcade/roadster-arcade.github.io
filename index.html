  <style>
    :root {
      --page: #040507;
      --focus: #7fe3ff;
      --note-h: 20px;
      --bezel: #15171c;
      --cap: #2b2e34;
      --cap-face: #353940;
      --cap-side: #121317;
      --well: #07080a;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--page);
      overflow: hidden;
    }

    /* The canvas fills the window edge to edge, above the note. */
    #stage {
      inset: 0 0 var(--note-h) 0;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #stage:focus {
      outline: none;
    }

    #game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* The pixel-art button is drawn on the canvas; this real button sits on
       top of it so it can be clicked, tabbed to and read by screen readers. */
    #play-again {
      background: transparent;
      border: 0;
      color: transparent;
      cursor: pointer;
      padding: 0;
      position: absolute;
    }

    #play-again:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    #share {
      background: transparent;
      border: 0;
      color: transparent;
      cursor: pointer;
      padding: 0;
      position: absolute;
    }

    #share:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    #hud,
    #pad {
      display: none;
    }

    #hud,
    #pad canvas,
    #note canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Always visible: this is a fan concept, not a Tesla product. */
    #note {
      align-items: center;
      bottom: 0;
      display: flex;
      height: var(--note-h);
      justify-content: center;
      left: 0;
      margin: 0;
      position: fixed;
      right: 0;
    }

    /* Held upright (phones): a handheld console. The HUD stands on its
       own at the top and only the 4:3 game screen sits in a frame. Below,
       the two flip keys sit above a space-bar-wide Jump key, lined up with
       its ends. Spread over the height so the keys fall under the thumbs;
       the note stays at the bottom. The game sizes the HUD, screen and keys
       to fit. */
    body.handheld {
      background: radial-gradient(120% 70% at 50% 30%, #0e1014 0%, var(--page) 70%);
      touch-action: manipulation;
    }

    body.handheld #console {
      align-items: center;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 28px;
      inset: 0;
      justify-content: space-evenly;
      padding: max(14px, env(safe-area-inset-top)) 16px calc(var(--note-h) + max(8px, env(safe-area-inset-bottom)));
      position: fixed;
    }

    body.handheld #screen {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    body.handheld #hud {
      display: block;
    }

    /* The same radius on every corner; the screen's is smaller by the
       frame's width, so the two curves run parallel. */
    body.handheld #frame {
      background: var(--bezel);
      border-radius: 18px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 18px 40px rgba(0, 0, 0, 0.55);
      padding: 8px;
    }

    body.handheld #stage {
      border-radius: 10px;
      inset: auto;
      position: relative;
    }

    body.handheld #pad {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* The flip keys share the row, a gap apart, as wide rectangles. */
    .flips {
      display: flex;
      gap: 26px;
    }

    .flips .control {
      flex: 1;
    }

    .flips .key {
      width: 100%;
    }

    /* A key with its label centred under it. The label may be wider than
       the key; it hangs over both sides so the key's edges stay aligned. */
    .control {
      display: flex;
      flex-direction: column;
      padding-bottom: 24px;
      position: relative;
    }

    .control .label {
      bottom: 0;
      left: 50%;
      position: absolute;
      transform: translateX(-50%);
    }

    /* A vintage mechanical key in dark mode: a sculpted cap with a dished
       top, standing on tall sides in a recessed switch well. Pressed, it
       travels down and its legend lights up. */
    .key {
      --travel: 6px;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      background: none;
      border: 0;
      cursor: pointer;
      height: 64px;
      padding: 0;
      position: relative;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      width: 76px;
    }

    .key.jump {
      height: 60px;
      width: 100%;
    }

    .key::before {
      background: var(--well);
      border-radius: 15px;
      box-shadow:
        inset 0 3px 6px rgba(0, 0, 0, 0.9),
        0 1px 0 rgba(255, 255, 255, 0.05);
      content: '';
      inset: -6px -6px -5px;
      position: absolute;
    }

    .cap {
      align-items: center;
      background: linear-gradient(180deg, #34373e 0%, var(--cap) 55%, #24272c 100%);
      border-radius: 11px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.09),
        inset 0 -2px 0 rgba(0, 0, 0, 0.25),
        0 var(--travel) 0 var(--cap-side),
        0 calc(var(--travel) + 2px) 7px rgba(0, 0, 0, 0.75);
      display: flex;
      inset: 0 0 var(--travel) 0;
      justify-content: center;
      position: absolute;
      transition: transform 45ms ease-out, box-shadow 45ms ease-out;
    }

    /* The dished top face, inset from the cap's skirt. */
    .cap::before {
      background: radial-gradient(90% 80% at 50% 35%, #3c4048 0%, var(--cap-face) 45%, #2a2d33 100%);
      border-radius: 8px;
      box-shadow:
        inset 0 2px 3px rgba(0, 0, 0, 0.35),
        inset 0 -1px 0 rgba(255, 255, 255, 0.05),
        0 1px 0 rgba(255, 255, 255, 0.05);
      content: '';
      inset: 4px 6px 8px;
      position: absolute;
    }

    .cap canvas {
      margin-bottom: 4px;
      position: relative;
      transition: filter 45ms ease-out;
    }

    .key.down .cap {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        inset 0 -2px 0 rgba(0, 0, 0, 0.25),
        0 1px 0 var(--cap-side),
        0 2px 3px rgba(0, 0, 0, 0.75);
      transform: translateY(calc(var(--travel) - 1px));
    }

    .key.down .cap canvas {
      filter: brightness(1.25) drop-shadow(0 0 5px var(--glow));
    }

    .key.back { --glow: rgba(255, 165, 61, 0.7); }
    .key.jump { --glow: rgba(242, 243, 245, 0.6); }
    .key.front { --glow: rgba(127, 227, 255, 0.7); }

    .key:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 8px;
      border-radius: 12px;
    }

    /* The credit: a small glass tag under the score, linking to the
       maker's Instagram. The game sizes and places it. */
    #credit {
      -webkit-backdrop-filter: blur(6px) saturate(140%);
      backdrop-filter: blur(6px) saturate(140%);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 4px 12px rgba(0, 0, 0, 0.35);
      display: flex;
      position: fixed;
      -webkit-tap-highlight-color: transparent;
      transition: background 120ms ease-out, border-color 120ms ease-out;
      z-index: 2;
    }

    #credit:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.22);
    }

    #credit:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    #credit canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .sr-only {
      clip: rect(0 0 0 0);
      height: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }

    /* ── Landscape mobile: floating flip buttons, side-by-side ───────── */
    #landscape-pad {
      display: none;
    }

    body.landscape-mobile #landscape-pad {
      display: flex;
      align-items: center;
      gap: 10px;
      position: fixed;
      bottom: 50%;
      transform: translateY(50%);
      left: max(8px, env(safe-area-inset-left));
      padding: 8px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px) saturate(130%);
      -webkit-backdrop-filter: blur(8px) saturate(130%);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 36px;
      pointer-events: auto;
      z-index: 10;
      transition: left 250ms ease, right 250ms ease;
    }

    /* When the user flips to the right side */
    body.landscape-mobile #landscape-pad.right-side {
      left: auto;
      right: max(8px, env(safe-area-inset-right));
    }

    .ls-flip {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.6);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      transition: background 80ms ease-out, transform 60ms ease-out,
                  border-color 80ms ease-out, box-shadow 80ms ease-out;
    }

    .ls-flip:active,
    .ls-flip.active {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.28);
      transform: scale(0.92);
    }

    /* Glow per button */
    .ls-flip.ls-back  { color: rgba(255, 165, 61, 0.85); }
    .ls-flip.ls-front { color: rgba(127, 227, 255, 0.85); }

    .ls-flip.ls-back:active,
    .ls-flip.ls-back.active {
      box-shadow: 0 0 14px rgba(255, 165, 61, 0.35);
    }
    .ls-flip.ls-front:active,
    .ls-flip.ls-front.active {
      box-shadow: 0 0 14px rgba(127, 227, 255, 0.35);
    }

    /* Toggle to pick which side the flip buttons sit on — top center */
    #ls-toggle {
      display: none;
    }

    body.landscape-mobile #ls-toggle {
      display: flex;
      align-items: center;
      gap: 0;
      position: fixed;
      top: max(6px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px) saturate(130%);
      -webkit-backdrop-filter: blur(8px) saturate(130%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      z-index: 15;
      padding: 0;
    }

    .ls-opt {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.25);
      font: 600 9px/1 system-ui, -apple-system, sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 10px;
      cursor: pointer;
      transition: background 100ms, color 100ms;
    }

    .ls-opt.active {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
